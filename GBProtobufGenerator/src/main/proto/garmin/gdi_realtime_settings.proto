message TimePickerOptions {
    optional uint32 min_time_seconds = 1;
    optional uint32 max_time_seconds = 2;
    optional uint32 granularity_seconds = 3;
}

message FloatPickerOptions {
    optional float minimum = 1;
    optional float maximum = 2;
    optional uint32 precision = 3;
    optional float granularity = 4;
}

message CIQLinkOptions {
    enum AppType {
        WATCH_APP = 0;
        WATCH_FACE = 1;
        DATA_FIELD = 2;
        WIDGET = 3;
        AUDIO_CONTENT_PROVIDER_APP = 4;
    }

    enum CIQLinkDestination {
        APP_STORE = 0;
        APP_SETTINGS = 1;
        APP_DETAILS = 2;
    }

    optional uint32 device_id = 1;
    optional bytes store_app_id = 2;
    optional uint32 app_version = 3;
    optional bytes mac_address = 4;
    optional GDI.Proto.RealtimeSettings.CIQLinkOptions.AppType app_type = 5;
    optional GDI.Proto.RealtimeSettings.CIQLinkOptions.CIQLinkDestination destination = 6;
}

message SettingsRequest {
    optional uint32 composition_id = 1;
    optional string app_locale = 2;
    optional uint32 data_bundle = 3;
}

message SelectionOptions {
    repeated GDI.Proto.RealtimeSettings.SelectionItem rows = 1;
    repeated GDI.Proto.RealtimeSettings.MenuItem menu_items = 2;
    optional bool exit_items_on_tap = 3;
    optional GDI.Proto.RealtimeSettings.FormattableString title = 4;
}

message SelectionItem {
    optional uint32 row_id = 1;
    optional GDI.Proto.RealtimeSettings.RowType type = 2;
    optional GDI.Proto.RealtimeSettings.FormattableString title = 3;
    optional GDI.Proto.RealtimeSettings.FormattableString subtext = 4;
    optional GDI.Proto.RealtimeSettings.LinkOptions link_options = 5;
    optional GDI.Proto.RealtimeSettings.Icon icon = 6;
    optional GDI.Proto.RealtimeSettings.DataScreenIconSetOptions data_screen_icon = 7;
    optional GDI.Proto.RealtimeSettings.WatchFaceIconSetOptions watch_face_icon = 8;
    optional GDI.Proto.RealtimeSettings.ControlsMenuIconSetOptions controls_menu_icon = 9;
    optional GDI.Proto.RealtimeSettings.ConfirmationMessage confirmation = 10;
    optional GDI.Proto.RealtimeSettings.IconSettings icon_settings = 11;
}


message IntegerPickerOptions {
    optional int32 minimum = 1;
    optional int32 maximum = 2;
    optional int32 granularity = 3;
}

message SettingsResponse {
    enum ResponseStatus {
        SUCCESS = 0;
        FAIL = 1;
    }

    optional GDI.Proto.RealtimeSettings.SettingsResponse.ResponseStatus status = 1;
    optional GDI.Proto.RealtimeSettings.Settings settings = 2;
}

message Settings {
    optional uint32 composition_id = 1;
    optional uint32 composition_version = 2;
    optional uint32 global_version = 3;
    repeated GDI.Proto.RealtimeSettings.RowValue rows = 4;
}

message RowValue {
    enum ViewState {
        VISIBLE = 0;
        HIDDEN = 1;
        DISABLED = 2;
    }

    optional uint32 row_id = 1;
    optional GDI.Proto.RealtimeSettings.RowValue.ViewState view_state = 2;
    optional GDI.Proto.RealtimeSettings.ToggleSettings toggle_settings = 3;
    optional GDI.Proto.RealtimeSettings.DoubleLabelSettings double_label_settings = 4;
    optional GDI.Proto.RealtimeSettings.AlertVolumeSettings alert_volume_settings = 6;
    optional GDI.Proto.RealtimeSettings.EditTextSettings edit_text_settings = 7;
    optional GDI.Proto.RealtimeSettings.SelectionSettings single_label_selection_settings = 8;
    optional GDI.Proto.RealtimeSettings.ActionSettings action_view_settings = 9;
    optional GDI.Proto.RealtimeSettings.WatchFaceGridSettings watch_face_grid_settings = 10;
    optional GDI.Proto.RealtimeSettings.TextSettings text_settings = 11;
    optional GDI.Proto.RealtimeSettings.BatteryStatusSettings battery_status_settings = 12;
    optional GDI.Proto.RealtimeSettings.SliderSettings slider_settings = 13;
}

message EditTextSettings {
    optional GDI.Proto.RealtimeSettings.FormattableString formatted_value = 1;
    optional GDI.Proto.RealtimeSettings.FormattableString edit_text_value = 2;
}


message ActionSettings {
    optional GDI.Proto.RealtimeSettings.FormattableString subtext = 1;
}

message AlertVolumeSettings {
    optional string alert_dialect = 1;
}

message ToggleSettings {
    optional bool toggle_value = 1;
    optional GDI.Proto.RealtimeSettings.FormattableString subtext = 2;
}

message DoubleLabelSettings {
    optional GDI.Proto.RealtimeSettings.FormattableString subtext = 1;
    optional GDI.Proto.RealtimeSettings.SelectionSettings selection_settings = 2;
    optional GDI.Proto.RealtimeSettings.TimePickerSettings time_picker_settings = 3;
    optional GDI.Proto.RealtimeSettings.TODPickerSettings tod_picker_settings = 4;
    optional GDI.Proto.RealtimeSettings.FloatPickerSettings float_picker_settings = 5;
    optional GDI.Proto.RealtimeSettings.IntegerPickerSettings integer_picker_settings = 6;
    optional GDI.Proto.RealtimeSettings.IntegerInputSettings integer_input_settings = 7;
    optional GDI.Proto.RealtimeSettings.DatePickerSettings date_picker_settings = 8;
    optional GDI.Proto.RealtimeSettings.MultiSelectionSettings multi_selection_settings = 9;
    optional GDI.Proto.RealtimeSettings.HeightPickerSettings height_picker_settings = 10;
    optional GDI.Proto.RealtimeSettings.IconSettings icon_settings = 11;
}

message SelectionSettings {
    optional uint32 selected_index = 1;
}

message TODPickerSettings {
    enum TimeFormat {
        TWELVE_HOUR = 0;
        TWENTY_FOUR_HOUR = 1;
    }

    optional uint32 seconds = 1;
    optional GDI.Proto.RealtimeSettings.FormattableString formatted_value = 2;
    optional GDI.Proto.RealtimeSettings.TODPickerSettings.TimeFormat time_format = 3;
    optional GDI.Proto.RealtimeSettings.FormattableString picker_title = 4;
}

message TimePickerSettings {
    optional uint32 seconds = 1;
    optional GDI.Proto.RealtimeSettings.FormattableString formatted_value = 2;
    optional GDI.Proto.RealtimeSettings.FormattableString picker_title = 3;
}

message FloatPickerSettings {
    optional float float_value = 1;
    optional GDI.Proto.RealtimeSettings.FormattableString formatted_value = 2;
    optional GDI.Proto.RealtimeSettings.FormattableString picker_title = 3;
    optional GDI.Proto.RealtimeSettings.FormattableString measurement_unit = 4;
}

message IntegerPickerSettings {
    optional int32 integer_value = 1;
    optional GDI.Proto.RealtimeSettings.FormattableString formatted_value = 2;
    optional GDI.Proto.RealtimeSettings.FormattableString picker_title = 3;
    optional GDI.Proto.RealtimeSettings.FormattableString measurement_unit = 4;
}

message DatePickerSettings {
    optional GDI.Proto.RealtimeSettings.FormattableString formatted_value = 1;
    optional GDI.Proto.RealtimeSettings.Date selected_date = 2;
    optional GDI.Proto.RealtimeSettings.Date minimum_date = 3;
    optional GDI.Proto.RealtimeSettings.Date maximum_date = 4;
}

message HeightPickerSettings {
    optional GDI.Proto.RealtimeSettings.FormattableString formatted_value = 1;
    optional uint32 height_value = 2;
    optional GDI.Proto.DataTypes.MeasurementUnit measurement_unit = 3;
}

message Date {
    optional int32 month = 1;
    optional int32 day = 2;
    optional int32 year = 3;
}

message SettingsChangeRequest {
    optional uint32 composition_id = 1;
    optional uint32 row_id = 2;
    optional GDI.Proto.RealtimeSettings.ToggleChange toggle_change = 3;
    optional GDI.Proto.RealtimeSettings.SelectionChange selection_change = 4;
    optional GDI.Proto.RealtimeSettings.TimePickerChange time_picker_change = 5;
    optional GDI.Proto.RealtimeSettings.TODPickerChange tod_picker_change = 6;
    optional GDI.Proto.RealtimeSettings.FloatPickerChange float_picker_change = 7;
    optional GDI.Proto.RealtimeSettings.IntegerPickerChange integer_picker_change = 8;
    optional GDI.Proto.RealtimeSettings.IntegerInputChange integer_input_change = 9;
    optional uint32 data_bundle = 10;
    optional GDI.Proto.RealtimeSettings.ReorderableItemChange reorderable_item_change = 11;
    optional GDI.Proto.RealtimeSettings.DatePickerChange date_picker_change = 12;
    optional GDI.Proto.RealtimeSettings.MultiSelectionChange multi_selection_change = 13;
    optional GDI.Proto.RealtimeSettings.EditTextValueChange edit_text_value_change = 14;
    optional GDI.Proto.RealtimeSettings.HeightPickerValueChange height_picker_value_change = 15;
    optional GDI.Proto.RealtimeSettings.WatchFaceGridValueChange watch_face_grid_value_change = 16;
    optional GDI.Proto.RealtimeSettings.SliderValueChange slider_value_change = 17;
}

message ToggleChange {
    optional bool new_toggle_value = 1;
}

message SelectionChange {
    optional uint32 new_selected_index = 1;
}

message TimePickerChange {
    optional uint32 new_seconds = 1;
}

message TODPickerChange {
    optional uint32 new_seconds = 1;
}

message IntegerPickerChange {
    optional int32 new_integer_value = 1;
}

message ReorderableItemChange {
    optional uint32 new_list_position = 1;
    optional bool is_delete = 2;
}

message DatePickerChange {
    optional GDI.Proto.RealtimeSettings.Date new_date = 1;
}

message EditTextValueChange {
    optional string new_edit_text_value = 1;
    optional int32 new_integer_value = 2;
    optional float new_float_value = 3;
}

message HeightPickerValueChange {
    optional uint32 height_value = 1;
    optional GDI.Proto.DataTypes.MeasurementUnit measurement_unit = 2;
}

message FloatPickerChange {
    optional float new_float_value = 1;
}

message SettingsChangeResponse {
    optional GDI.Proto.RealtimeSettings.ResponseStatus status = 1;
    optional GDI.Proto.RealtimeSettings.InformationMessage information_message = 2;
    optional GDI.Proto.RealtimeSettings.Settings updated_settings = 3;
    optional bool is_invalidate = 4;
    optional bool is_exit_instance = 5;
}

message InformationMessage {
    optional GDI.Proto.RealtimeSettings.FormattableString title = 1;
    optional GDI.Proto.RealtimeSettings.FormattableString message = 2;
    optional GDI.Proto.RealtimeSettings.FormattableString neutral_text = 3;
}

message StartUpDataRequest {
    optional string app_locale = 1; // en_US
    optional string app_consent_country = 2; // us
}

message StartUpDataResponse {
    optional string app_locale_language_part_number = 1;
    optional string device_locale_language_part_number = 2;
    repeated GDI.Proto.RealtimeSettings.IconSet icon_sets = 3;
    optional GDI.Proto.RealtimeSettings.CommunicateType communicate_type = 4;
}

enum ResponseStatus {
    SUCCESS = 0;
    FAIL = 1;
    CURRENTLY_UNAVAILABLE = 2;
}

enum IconSet {
    BASE = 0;
    DATA_SCREEN_CIRCULAR = 1;
    DATA_SCREEN_EDGE_PORTRAIT = 2;
    DATA_SCREEN_INSTINCT = 3;
    CONTROLS_MENU = 4;
    ACTIVITIES_APPS = 5;
    WATCH_FACES = 6;
    DATA_SCREEN_RECTANGULAR = 7;
    WATCH_FACES_PREVIEW_LILY2 = 8;
    WATCH_FACES_PREVIEW_LILY2_ACTIVE = 9;
    DATA_SCREEN_ANALOG_HANDS = 10;
}

enum CommunicateType {
    REQUEST_RESPONSE = 0;
    NOTIFICATION = 1;
}

message SettingsUpdatedNotification {
}

message ConfirmationMessage {
    optional GDI.Proto.RealtimeSettings.FormattableString title = 1;
    optional GDI.Proto.RealtimeSettings.FormattableString message = 2;
    optional GDI.Proto.RealtimeSettings.FormattableString positive_text = 3;
    optional GDI.Proto.RealtimeSettings.FormattableString negative_text = 4;
    optional bool destructive_positive_action = 5;
    optional bool destructive_negative_action = 6;
}

message MenuItem {
    enum FallbackClickEvent {
        NONE = 0;
        EXIT_INSTANTIATE = 1;
        EXIT = 2;
    }

    enum MenuType {
        UNKNOWN_OPTION = 0;
        SYNC_DEVICE = 1;
        REMOVE_DEVICE = 2;
        PULSE_OX_HELP = 3;
        TEXT = 4;
        ACTION_SAVE = 5;
        ACTION_CANCEL = 6;
        CUSTOM_ACTION = 7;
        MANAGE_DEVICE_PRIORITY = 8;
    }

    enum Position {
        RIGHT = 0;
        LEFT = 1;
