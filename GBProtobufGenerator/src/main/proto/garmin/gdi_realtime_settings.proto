    optional GDI.Proto.RealtimeSettings.SelectionOptions selection_options = 4;
    optional GDI.Proto.RealtimeSettings.TimePickerOptions time_picker_options = 5;
    optional GDI.Proto.RealtimeSettings.TODPickerOptions tod_picker_options = 6;
    optional GDI.Proto.RealtimeSettings.FloatPickerOptions float_picker_options = 7;
    optional GDI.Proto.RealtimeSettings.IntegerPickerOptions integer_picker_options = 8;
    optional GDI.Proto.RealtimeSettings.IntegerInputOptions integer_input_options = 9;
    optional uint32 data_bundle = 10;
    optional GDI.Proto.RealtimeSettings.CIQLinkOptions ciq_link_options = 11;
