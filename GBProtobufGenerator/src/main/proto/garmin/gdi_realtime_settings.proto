    enum LinkType {
        INTERNAL = 0;
        SELECTION = 1;
        TIME_PICKER = 2;
        TOD_PICKER = 3;
        FLOAT_PICKER = 4;
        INTEGER_PICKER = 5;
        EXTERNAL = 6;
        DEVICE_ONLY = 7;
