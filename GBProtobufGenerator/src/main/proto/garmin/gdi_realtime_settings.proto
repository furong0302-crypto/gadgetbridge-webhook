syntax = "proto2";

package GDI.Proto.RealtimeSettings;

option java_package = "nodomain.freeyourgadget.gadgetbridge.proto.garmin";
option java_outer_classname = "GdiRealtimeSettings";

import "garmin/gdi_data_types.proto";

message RealtimeSettingsService {
    optional GDI.Proto.RealtimeSettings.CompositionRequest composition_request = 1;
    optional GDI.Proto.RealtimeSettings.CompositionResponse composition_response = 2;

    optional GDI.Proto.RealtimeSettings.SettingsRequest settings_request = 3;
    optional GDI.Proto.RealtimeSettings.SettingsResponse settings_response = 4;

    optional GDI.Proto.RealtimeSettings.SettingsChangeRequest settings_change_request = 5;
    optional GDI.Proto.RealtimeSettings.SettingsChangeResponse settings_change_response = 6;

    optional GDI.Proto.RealtimeSettings.SettingsUpdatedNotification settings_updated_notification = 7;

    optional GDI.Proto.RealtimeSettings.StartUpDataRequest start_up_data_request = 8;
    optional GDI.Proto.RealtimeSettings.StartUpDataResponse start_up_data_response = 9;

    optional GDI.Proto.RealtimeSettings.MenuChangeRequest menu_change_request = 10;
    optional GDI.Proto.RealtimeSettings.MenuChangeResponse menu_change_response = 11;

    optional GDI.Proto.RealtimeSettings.SettingsStateRequest settings_state_request = 12;
    optional GDI.Proto.RealtimeSettings.SettingsStateResponse settings_state_response = 13;
}

message MenuChangeRequest {
    optional uint32 composition_id = 1;
    optional uint32 menu_id = 2;
}

message MenuChangeResponse {
    optional GDI.Proto.RealtimeSettings.ResponseStatus status = 1;
    optional GDI.Proto.RealtimeSettings.InformationMessage information_message = 2;
    optional bool is_invalidate = 3;
    optional bool is_exit_instance = 4;
}

message SettingsStateRequest {
    enum WellKnownSettingState {
        UNKNOWN = 0;
        SOFTWARE_UPDATE = 1;
        DESCENT_TRANSMITTER_LIST = 2;
    }

    repeated GDI.Proto.RealtimeSettings.SettingsStateRequest.WellKnownSettingState setting_ids = 1;
}

message SettingsStateResponse {
    repeated string setting_states = 1;
}

message CompositionRequest {
    enum AppId {
        GCM = 0;
        DIVE = 1;
        EXPLORE = 2;
    }

    optional uint32 composition_id = 1;
    optional int32 depth = 2;
    optional string app_locale = 3; // en_US
    optional bool app_localized_text_initialization_complete = 4;
    optional GDI.Proto.RealtimeSettings.CompositionRequest.AppId app_id = 5;
}

message CompositionResponse {
    enum ResponseStatus {
        SUCCESS = 0;
        PARTIAL_SUCCESS = 1;
        FAIL = 2;
    }

    optional GDI.Proto.RealtimeSettings.CompositionResponse.ResponseStatus status = 1;
    optional GDI.Proto.RealtimeSettings.Composition compositions = 2;
}

message Composition {
    optional uint32 composition_id = 1;
    optional uint32 version = 2; // 0
    optional uint32 global_version = 3; // 928002
    optional GDI.Proto.RealtimeSettings.FormattableString title = 4;
    repeated GDI.Proto.RealtimeSettings.CompositionRow rows = 5;
    repeated GDI.Proto.RealtimeSettings.MenuItem menu_items = 6;
}

message FormattableString {
    optional bytes handle = 1;
    optional string text = 2;
    repeated string format_args = 3;
    repeated bytes format_args_handles = 4;
}

message CompositionRow {
    enum Platform {
        ALL = 0;
        ANDROID = 1;
        IOS = 2;
        DEVICE = 3;
    }

    optional uint32 row_id = 1;
    optional GDI.Proto.RealtimeSettings.RowType type = 2;
    optional GDI.Proto.RealtimeSettings.FormattableString title = 3;
    optional GDI.Proto.RealtimeSettings.CompositionRow.Platform platform = 4;
    optional GDI.Proto.RealtimeSettings.Icon icon = 5;
    optional GDI.Proto.RealtimeSettings.TextOptions text_options = 6;
    optional GDI.Proto.RealtimeSettings.SpacerOptions spacer_options = 7;
    optional GDI.Proto.RealtimeSettings.ToggleOptions toggle_options = 8;
    optional GDI.Proto.RealtimeSettings.LinkOptions link_options = 9;
    optional GDI.Proto.RealtimeSettings.ActionOptions action_options = 10;
    optional GDI.Proto.RealtimeSettings.Icon right_drawable = 11;
    optional GDI.Proto.RealtimeSettings.ReorderListOptions reorder_list_options = 12;
    optional GDI.Proto.RealtimeSettings.EditTextOptions edit_text_options = 13;
    optional GDI.Proto.RealtimeSettings.DataScreenIconSetOptions data_screen_icon = 14;
    optional GDI.Proto.RealtimeSettings.EmptyStateViewOptions empty_state_view_options = 15; // info text if nothing can be set
    optional GDI.Proto.RealtimeSettings.WatchFaceIconSetOptions watch_face_icon = 16;
    optional GDI.Proto.RealtimeSettings.Icon left_drawable = 17;
    optional GDI.Proto.RealtimeSettings.ControlsMenuIconSetOptions controls_menu_icon = 18;
    optional GDI.Proto.RealtimeSettings.WatchFaceGridOptions watch_face_grid_options = 19;
    optional GDI.Proto.RealtimeSettings.SliderOptions slider_options = 20;
}

message TextOptions {
    enum TextGravity {
        START = 0;
        CENTER = 1;
    }

    enum TextStyle {
        BODY = 0;
        BULLET = 1;
        INFO = 2;
        LINK = 3;
        SUBTITLE = 4;
        TITLE = 5;
        TITLE2 = 6;
    }

    optional GDI.Proto.RealtimeSettings.TextOptions.TextStyle style = 1;
    optional string redirect_url = 2;
    optional GDI.Proto.RealtimeSettings.TextOptions.TextGravity gravity = 3;
}

message SpacerOptions {
    optional uint32 spacer_multiple = 1;
}

message ToggleOptions {
    optional GDI.Proto.RealtimeSettings.ConfirmationMessage confirmation = 1;
}

message ActionOptions {
    optional GDI.Proto.RealtimeSettings.ConfirmationMessage confirmation = 1;
}

message DataScreenIconSetOptions {
    enum LayoutField {
        NONE = 0;
        NO_LABEL = 1;
        STACK = 2;
        RING = 3;
        QUAD = 4;
        THREE_ROW = 5;
        MIXED = 6;
        A = 7;
        B = 8;
        C = 9;
        D = 10;
        E = 11;
        F = 12;
        MAP_NONE = 13;
        MAP_A = 14;
        MAP_B = 15;
        COMPASS_NONE = 16;
        LAP_SUMMARY_NONE = 17;
        LAP_SUMMARY_A = 18;
        LAP_SUMMARY_B = 19;
        SEGMENT_NONE = 20;
        SEGMENT_A = 21;
        SEGMENT_B = 22;
        SEGMENT_C = 23;
        STAMINA_NONE = 24;
        STAMINA_A = 25;
        STAMINA_B = 26;
        SOLAR_NONE = 27;
        EBIKE_NONE = 28;
        EBIKE_A = 29;
        EBIKE_B = 30;
        SHIMANO_STEPS_NONE = 31;
        ELEVATION_NONE = 32;
        CLIMB_PRO_NONE = 33;
        WORKOUT_NONE = 34;
        CYCLING_DYNAMICS_NONE = 35;
        POWER_GUIDANCE_NONE = 36;
    }

    optional GDI.Proto.RealtimeSettings.IconSet icon_set = 1;
    optional uint32 number_of_fields = 2;
    optional GDI.Proto.RealtimeSettings.DataScreenIconSetOptions.LayoutField layout = 3;
    optional bool is_preview = 4;
}

message EmptyStateViewOptions {
    optional GDI.Proto.RealtimeSettings.FormattableString description = 1;
    optional GDI.Proto.RealtimeSettings.FormattableString action_text = 2;
}

message ControlsMenuIconSetOptions {
    optional GDI.Proto.RealtimeSettings.IconSet icon_set = 1;
    optional uint32 control = 2;
}

message ReorderListOptions {
    enum ActionType {
        ADD = 0;
        DELETE = 1;
        NONE = 2;
    }

    optional uint32 group_id = 2;
    optional GDI.Proto.RealtimeSettings.ReorderListOptions.ActionType action_type = 3;
    optional GDI.Proto.RealtimeSettings.ConfirmationMessage delete_confirmation = 4;
    repeated GDI.Proto.RealtimeSettings.ReorderListItem list_items = 5;
}

message ReorderListItem {
    optional uint32 row_id = 1;
    optional GDI.Proto.RealtimeSettings.FormattableString title = 2;
    optional GDI.Proto.RealtimeSettings.Icon icon = 3;
    optional GDI.Proto.RealtimeSettings.DataScreenIconSetOptions icon_set = 4;
    optional bool action_enabled = 5;
    optional GDI.Proto.RealtimeSettings.ControlsMenuIconSetOptions controls_menu_icon = 6;
}


message EditTextOptions {
    enum KeyBoardType {
        ALPHANUMERIC = 0;
        INTEGER = 1;
        DECIMAL = 2;
    }
    optional GDI.Proto.RealtimeSettings.EditTextProperties edit_text_properties = 1;
    optional GDI.Proto.RealtimeSettings.EditTextOptions.KeyBoardType edit_text_type = 2;
    optional GDI.Proto.RealtimeSettings.EditTextIntegerOptions edit_text_integer_options = 3;
    optional GDI.Proto.RealtimeSettings.EditTextDecimalOptions edit_text_decimal_options = 4;
}

message EditTextProperties {
    optional int32 maximum_code_point_length = 1;
}

message EditTextIntegerOptions {
    optional int32 minimum = 1;
    optional int32 maximum = 2;
}

message EditTextDecimalOptions {
    optional float minimum = 1;
    optional float maximum = 2;
    optional int32 precision = 3;
}

