        BODY_COMP_REFERENCE_VALUES = 45;
        DESTINATION_46 = 46;
        DESTINATION_47 = 47;
        DESTINATION_48 = 48;
        DESTINATION_49 = 49;
        DESTINATION_50 = 50;
        DESTINATION_51 = 51;
        DESTINATION_52 = 52;
        DESTINATION_53 = 53;
        DESTINATION_54 = 54;
        DESTINATION_55 = 55;
        DESTINATION_56 = 56;
        DESTINATION_57 = 57;
